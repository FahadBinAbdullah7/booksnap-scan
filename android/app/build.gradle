apply plugin: 'com.android.application'

// Version: from the release tag on GitHub (APP_VERSION=1.2.0), else package.json.
// versionCode = 1.2.3 -> 10203, so every release is newer than the last.
def pkgJson = new groovy.json.JsonSlurper().parse(file("../../package.json"))
def appVersion = (System.getenv("APP_VERSION") ?: pkgJson.version).toString()
def vparts = (appVersion.tokenize('.') + ['0', '0', '0']).take(3).collect { (it.replaceAll(/[^0-9].*/, '') ?: '0') as int }
def appVersionCode = vparts[0] * 10000 + vparts[1] * 100 + vparts[2]

android {
    namespace = "com.booksnap.scanner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.booksnap.scanner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One signing key for every build, so installed apps can update in place.
    // GitHub Actions passes the key from repository secrets; on this Mac it falls back
    // to the key the first APKs were signed with (~/.android/debug.keystore).
    // Google Play upload key: only on this Mac, in play-signing/ (git-ignored, keep a backup)
    def playProps = new Properties()
    def playPropsFile = rootProject.file("../play-signing/upload.properties")
    if (playPropsFile.exists()) playPropsFile.withInputStream { playProps.load(it) }
    signingConfigs {
        if (playPropsFile.exists()) {
            play {
                storeFile new File(playPropsFile.parentFile, playProps.getProperty("storeFile"))
                storePassword playProps.getProperty("storePassword")
                keyAlias playProps.getProperty("keyAlias")
                keyPassword playProps.getProperty("keyPassword")
            }
        }
        release {
            storeFile file(System.getenv("BOOKSNAP_KEYSTORE") ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword System.getenv("BOOKSNAP_KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("BOOKSNAP_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("BOOKSNAP_KEY_PASSWORD") ?: "android"
        }
    }
    // Two editions of the same app:
    //  - github: the APK on GitHub releases, with the in-app "Check for updates"
    //  - play:   the Google Play bundle (.aab) — no self-updater, no install-APK permission
    //            (Google Play delivers updates itself and does not allow apps to install APKs)
    flavorDimensions = ["dist"]
    productFlavors {
        github { dimension "dist"; buildConfigField "boolean", "PLAY_STORE", "false"; signingConfig signingConfigs.release }
        // Google Play refuses debug-signed bundles: sign with the Play upload key when it is on this Mac
        play { dimension "dist"; buildConfigField "boolean", "PLAY_STORE", "true"
               signingConfig playPropsFile.exists() ? signingConfigs.play : signingConfigs.release }
    }
    buildFeatures { buildConfig = true }
    buildTypes {
        release {
            // signing comes from the edition (github / play) above
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // real phone camera (smooth preview, autofocus, full-quality photos)
    def camerax = "1.4.2"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
