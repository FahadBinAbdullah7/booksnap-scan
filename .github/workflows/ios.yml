# iPhone app (unsigned .ipa — install it with Sideloadly / AltStore using your Apple ID).
#  - push to branch "ios-build": test build -> pre-release "ios-test" (or "ios-ci-log" with the log if it fails)
#  - a v* release: attaches BookSnap-vX.Y.Z.ipa next to the Android APK
name: iPhone app

on:
  push:
    branches: ["ios-build"]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p "require('./package.json').version")"; fi
          IFS=. read -r a b c <<< "$V"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_BUILD=$((a * 10000 + b * 100 + c))" >> "$GITHUB_ENV"

      - name: Newest Xcode
        run: |
          X="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install
        run: npm ci

      - name: Copy the app into the Xcode project
        run: npx cap sync ios

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" | tail -80
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "BookSnap-v$APP_VERSION.ipa" Payload

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="BookSnap-v$APP_VERSION.ipa"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            for i in $(seq 1 40); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 15; done   # the Android job creates the release
            gh release upload "$GITHUB_REF_NAME" "$IPA" --clobber
          else
            gh release view ios-test >/dev/null 2>&1 || gh release create ios-test --prerelease --title "iPhone test build" --notes "Unsigned test build of the iPhone app." --target "$GITHUB_SHA"
            gh release upload ios-test "$IPA" --clobber
          fi

      - name: Publish the build log (only if something failed)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "no build log (failed before building)" > build.log
          tail -400 build.log > ios-build-log.txt
          gh release view ios-ci-log >/dev/null 2>&1 || gh release create ios-ci-log --prerelease --title "iPhone build log" --notes "Log of the last failed iPhone build." --target "$GITHUB_SHA"
          gh release upload ios-ci-log ios-build-log.txt --clobber
