# Builds the Android app and attaches BookSnap-vX.Y.Z.apk to a GitHub release.
# Start it by publishing a release with a tag like v1.2.0 (or pushing that tag).
# Installed apps see the new release and offer the update.
name: Build & release APK

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version from the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1; }
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.BOOKSNAP_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Secret BOOKSNAP_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/booksnap.keystore"
          echo "BOOKSNAP_KEYSTORE=$RUNNER_TEMP/booksnap.keystore" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          BOOKSNAP_KEYSTORE_PASSWORD: ${{ secrets.BOOKSNAP_KEYSTORE_PASSWORD }}
          BOOKSNAP_KEY_ALIAS: ${{ secrets.BOOKSNAP_KEY_ALIAS }}
          BOOKSNAP_KEY_PASSWORD: ${{ secrets.BOOKSNAP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BookSnap-v$APP_VERSION.apk"

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "BookSnap-v$APP_VERSION.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "BookSnap-v$APP_VERSION.apk" --title "BookSnap $APP_VERSION" --generate-notes
          fi
